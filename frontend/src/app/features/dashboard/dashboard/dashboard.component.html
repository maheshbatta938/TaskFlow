<div class="page-header flex-between flex-wrap gap-3">
  <div>
    <h1>Welcome back{{ userName ? ', ' + userName : '' }}</h1>
    <p class="text-muted">Here's an overview of your tasks.</p>
  </div>
  <a routerLink="/tasks/new" class="btn btn-primary">
    <app-icon name="plus" [size]="16"></app-icon>
    New Task
  </a>
</div>

<app-loading *ngIf="loading" message="Loading analytics..."></app-loading>

<app-error-state *ngIf="!loading && error" message="Couldn't load your analytics." (retry)="loadAnalytics()"></app-error-state>

<ng-container *ngIf="!loading && !error && analytics as data">
  <div class="grid grid-cols-4">
    <app-analytics-card label="Total tasks" [value]="data.total" icon="clipboard"></app-analytics-card>
    <app-analytics-card label="Completed" [value]="data.completed" icon="check-circle" variant="success"></app-analytics-card>
    <app-analytics-card label="Pending" [value]="data.pending" icon="clock" variant="warning"></app-analytics-card>
    <app-analytics-card label="Completion rate" [value]="data.completionPercentage + '%'" icon="trend-up" variant="success"></app-analytics-card>
  </div>

  <div class="grid grid-cols-4" style="margin-top: 20px;">
    <app-analytics-card label="Overdue" [value]="data.overdue" icon="alarm" variant="danger"></app-analytics-card>
  </div>

  <div class="dashboard-breakdown">
    <div class="card">
      <h3 class="dashboard-breakdown__title">Tasks by status</h3>
      <div class="breakdown-row" *ngFor="let status of statusKeys">
        <app-status-badge [status]="status"></app-status-badge>
        <span class="text-muted">{{ statusCount(status) }} task(s)</span>
      </div>
    </div>

    <div class="card">
      <h3 class="dashboard-breakdown__title">Tasks by priority</h3>
      <div class="breakdown-row" *ngFor="let priority of priorityKeys">
        <app-priority-badge [priority]="priority"></app-priority-badge>
        <span class="text-muted">{{ priorityCount(priority) }} task(s)</span>
      </div>
    </div>
  </div>
</ng-container>
