<h2 class="auth-form__title">Welcome back</h2>
<p class="auth-form__subtitle">Log in to keep track of your tasks.</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-group">
    <label class="form-label" for="email">Email</label>
    <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="f['email'].invalid && f['email'].touched" placeholder="you@example.com" />
    <div class="form-error" *ngIf="f['email'].invalid && f['email'].touched">
      <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
      <span *ngIf="f['email'].errors?.['email']">Enter a valid email address.</span>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="password">Password</label>
    <input id="password" type="password" class="form-control" formControlName="password" [class.is-invalid]="f['password'].invalid && f['password'].touched" placeholder="••••••••" />
    <div class="form-error" *ngIf="f['password'].invalid && f['password'].touched">Password is required.</div>
  </div>

  <button type="submit" class="btn btn-primary auth-form__submit" [disabled]="submitting">
    {{ submitting ? 'Logging in...' : 'Log in' }}
  </button>
</form>

<p class="auth-form__switch">
  Don't have an account? <a routerLink="/signup">Sign up</a>
</p>
