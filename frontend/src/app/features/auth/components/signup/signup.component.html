<h2 class="auth-form__title">Create your account</h2>
<p class="auth-form__subtitle">Start organizing your work in minutes.</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-group">
    <label class="form-label" for="name">Full name</label>
    <input id="name" type="text" class="form-control" formControlName="name" [class.is-invalid]="f['name'].invalid && f['name'].touched" placeholder="Jane Doe" />
    <div class="form-error" *ngIf="f['name'].invalid && f['name'].touched">Name is required.</div>
  </div>

  <div class="form-group">
    <label class="form-label" for="email">Email</label>
    <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="f['email'].invalid && f['email'].touched" placeholder="you@example.com" />
    <div class="form-error" *ngIf="f['email'].invalid && f['email'].touched">
      <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
      <span *ngIf="f['email'].errors?.['email']">Enter a valid email address.</span>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="password">Password</label>
    <input id="password" type="password" class="form-control" formControlName="password" [class.is-invalid]="f['password'].invalid && f['password'].touched" placeholder="At least 6 characters" />
    <div class="form-error" *ngIf="f['password'].invalid && f['password'].touched">
      <span *ngIf="f['password'].errors?.['required']">Password is required.</span>
      <span *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters.</span>
    </div>
  </div>

  <button type="submit" class="btn btn-primary auth-form__submit" [disabled]="submitting">
    {{ submitting ? 'Creating account...' : 'Sign up' }}
  </button>
</form>

<p class="auth-form__switch">
  Already have an account? <a routerLink="/login">Log in</a>
</p>
