<div class="toast-container">
  <div *ngFor="let toast of toasts" class="toast" [class.toast--error]="toast.type === 'error'" [class.toast--success]="toast.type === 'success'">
    <span>{{ toast.message }}</span>
    <button type="button" class="toast__close" (click)="dismiss(toast.id)" aria-label="Dismiss">&times;</button>
  </div>
</div>
